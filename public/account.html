<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的额度 · NovelAI 共享</title><link rel="stylesheet" href="/members.css"><script type="module" src="/account.js?v=20261007-base-url"></script></head>
<body><main><nav><a href="/">共享账户首页</a><span>NovelAI 共享</span></nav>
<section id="login"><h1>登录你的账户</h1><p>账户由管理员创建。登录后查看个人额度和调用记录。</p><form id="loginForm"><label>用户名<input id="username" autocomplete="username" required maxlength="40"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>登录</button></form></section>
<section id="account" hidden><header><div><h1 id="welcome">我的额度</h1><p id="group"></p></div><button id="logout" class="secondary">退出登录</button></header><p id="status" class="notice"></p>
<div class="cards"><article><h2>V5 恢复额度</h2><strong id="v5">—</strong><progress id="v5bar" max="100" value="0"></progress><p id="recovery"></p><small>单次消耗为估算值，按官方总余额校准。</small></article><article><h2>订阅 Anlas</h2><strong id="fixed">—</strong><p id="fixedHeld"></p></article><article><h2>购买 Anlas</h2><strong id="purchased">—</strong><p id="purchasedHeld"></p><small>需请求明确授权，且官方订阅余额耗尽并完成对账后才能使用。</small></article></div>
<div class="actions"><button id="refresh" class="secondary">刷新额度</button><button id="showKey" class="secondary">查看我的 API Key</button></div><div id="keyPanel" hidden><label>Base URL<input id="apiBaseUrl" readonly></label><label>我的 API Key<input id="apiKey" readonly type="password"></label><button id="copyKey" class="secondary">复制 Key</button><button id="hideKey" class="secondary">隐藏</button></div>
<h2>最近 30 条调用</h2><div class="tablewrap"><table><thead><tr><th>时间</th><th>模型</th><th>状态</th><th>额度记录</th></tr></thead><tbody id="jobs"></tbody></table></div><p class="muted">账户、分组、密码和额度分配由管理员管理。所有成员合计最多 4 个并发请求。</p></section><p id="message" role="status"></p></main></body></html>
